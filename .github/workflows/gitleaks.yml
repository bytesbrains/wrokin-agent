# Secret scan on every push and PR, over the full history. Runs the gitleaks CLI image
# rather than gitleaks-action, which needs a paid licence for organisation accounts.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --exit-code 1 --config /repo/.gitleaks.toml /repo
